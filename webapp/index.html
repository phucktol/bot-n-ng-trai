<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nông Trại Của Tôi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, sans-serif;
    background: var(--tg-theme-bg-color, #f0f4e8);
    color: var(--tg-theme-text-color, #222);
    padding: 16px;
    padding-bottom: 40px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .money {
    font-size: 16px;
    color: #d68a00;
    margin-bottom: 16px;
  }
  .plots {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .plot {
    background: #fff;
    border-radius: 14px;
    padding: 14px 8px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    min-height: 110px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .plot .icon { font-size: 34px; margin-bottom: 6px; }
  .plot .status { font-size: 12px; color: #666; margin-bottom: 8px; }
  .plot button {
    border: none;
    border-radius: 8px;
    padding: 8px 4px;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    background: #4caf50;
    cursor: pointer;
  }
  .plot button.harvest { background: #ff9800; }
  .plot button:disabled { background: #ccc; }
  .crop-menu {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: #fff;
    border-radius: 20px 20px 0 0;
    padding: 20px;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
  }
  .crop-menu.show { display: block; }
  .crop-option {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    border-radius: 10px;
    background: #f5f5f5;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .invite-box {
    background: #fff;
    border-radius: 14px;
    padding: 16px;
    margin-top: 10px;
  }
  .invite-box button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #2196f3;
    color: #fff;
    font-weight: 600;
    margin-top: 8px;
  }
  .loading { text-align: center; padding: 40px; color: #999; }
</style>
</head>
<body>

<div id="app" class="loading">Đang tải nông trại...</div>

<div id="cropMenu" class="crop-menu">
  <h3 style="margin-bottom:12px;">Chọn cây muốn trồng</h3>
  <div id="cropOptions"></div>
  <button onclick="closeCropMenu()" style="width:100%;padding:10px;border:none;border-radius:10px;background:#eee;margin-top:6px;">Đóng</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.ready();

const userId = tg.initDataUnsafe?.user?.id || 'demo';
let farmData = null;
let selectedPlot = null;

const CROPS = {
  carrot: { name: '🥕 Cà rốt', growTime: 30, sellPrice: 15, cost: 5 },
  wheat:  { name: '🌾 Lúa mì', growTime: 60, sellPrice: 35, cost: 10 },
};

async function loadFarm() {
  const res = await fetch(`/api/farm/${userId}`);
  farmData = await res.json();
  render();
}

function render() {
  const app = document.getElementById('app');
  app.className = '';
  let plotsHtml = '<div class="plots">';

  farmData.plots.forEach((plot, i) => {
    if (!plot.crop) {
      plotsHtml += `
        <div class="plot">
          <div class="icon">🟫</div>
          <div class="status">Đất trống</div>
          <button onclick="openCropMenu(${i})">🌱 Trồng</button>
        </div>`;
    } else {
      const crop = CROPS[plot.crop];
      const elapsed = (Date.now() - plot.plantedAt) / 1000;
      const remaining = Math.max(0, crop.growTime - elapsed);
      if (remaining <= 0) {
        plotsHtml += `
          <div class="plot">
            <div class="icon">${crop.name.split(' ')[0]}</div>
            <div class="status">✅ Sẵn sàng</div>
            <button class="harvest" onclick="harvest(${i})">🌾 Thu hoạch</button>
          </div>`;
      } else {
        plotsHtml += `
          <div class="plot">
            <div class="icon">${crop.name.split(' ')[0]}</div>
            <div class="status">⏳ còn ${Math.ceil(remaining)}s</div>
            <button disabled>Đang lớn</button>
          </div>`;
      }
    }
  });
  plotsHtml += '</div>';

  app.innerHTML = `
    <h1>🌱 Nông trại của bạn</h1>
    <div class="money">💰 ${farmData.money} tiền &nbsp;|&nbsp; 👥 Đã mời ${farmData.referralCount || 0} người</div>
    ${plotsHtml}
    <div class="invite-box">
      <div>Mời bạn bè: bạn +30, bạn của bạn +50 tiền</div>
      <button onclick="invite()">👥 Lấy link mời bạn</button>
    </div>
  `;
}

function openCropMenu(plotIndex) {
  selectedPlot = plotIndex;
  const optionsDiv = document.getElementById('cropOptions');
  optionsDiv.innerHTML = Object.entries(CROPS).map(([key, crop]) => `
    <div class="crop-option" onclick="plant('${key}')">
      <span>${crop.name}</span>
      <span>${crop.cost} tiền</span>
    </div>
  `).join('');
  document.getElementById('cropMenu').classList.add('show');
}
function closeCropMenu() {
  document.getElementById('cropMenu').classList.remove('show');
}

async function plant(cropKey) {
  closeCropMenu();
  const res = await fetch('/api/plant', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ userId, plotIndex: selectedPlot, cropKey }),
  });
  const data = await res.json();
  if (data.error) { tg.showAlert(data.error); return; }
  farmData = data.farm;
  render();
  tg.HapticFeedback.notificationOccurred('success');
}

async function harvest(plotIndex) {
  const res = await fetch('/api/harvest', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ userId, plotIndex }),
  });
  const data = await res.json();
  if (data.error) { tg.showAlert(data.error); return; }
  farmData = data.farm;
  render();
  tg.HapticFeedback.notificationOccurred('success');
}

function invite() {
  fetch(`/api/botinfo`).then(r => r.json()).then(({ username }) => {
    const link = `https://t.me/${username}?start=${userId}`;
    tg.switchInlineQuery ? null : null;
    tg.showPopup({
      title: 'Link mời bạn bè',
      message: link,
      buttons: [{ type: 'default', text: 'Đóng' }],
    });
  });
}

// Tự làm mới mỗi 5 giây để cập nhật thời gian đếm ngược
setInterval(loadFarm, 5000);
loadFarm();
</script>

</body>
</html>
